services:
  postgres:
    image: postgres:17-alpine
    container_name: piscineds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acosgun
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: piscineds
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - piscineds_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acosgun -d piscineds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - piscineds_network

volumes:
  piscineds_data:

networks:
  piscineds_network:
    driver: bridge
